schema_version: 1
experiment:
  name: resnet18_camera
  seed: 43
  output_root: /kaggle/working/icv_weekly_results/outputs
data:
  root: /kaggle/temp/icv_weekly_repo/data/raw/NEU-CLS
  manifest: /kaggle/temp/icv_weekly_repo/data/manifests/neu_cls_v2.csv
  image_size: 224
  augmentation: camera_aware
model:
  name: resnet18
  pretrained: true
training:
  epochs: 50
  batch_size: 32
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.05
  early_stopping_patience: 10
  warmup_epochs: 3
  min_learning_rate: 1.0e-06
  amp: true
  device: cuda
