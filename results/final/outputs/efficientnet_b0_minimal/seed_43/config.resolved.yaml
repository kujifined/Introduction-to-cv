schema_version: 1
experiment:
  name: efficientnet_b0_minimal
  seed: 43
  output_root: /kaggle/working/icv_pair_results/outputs
data:
  root: data/raw/NEU-CLS
  manifest: data/manifests/neu_cls_v2.csv
  image_size: 224
  augmentation: minimal
model:
  name: efficientnet_b0
  pretrained: true
training:
  epochs: 50
  batch_size: 32
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.05
  early_stopping_patience: 10
  warmup_epochs: 3
  min_learning_rate: 1.0e-06
  amp: true
  device: cuda
